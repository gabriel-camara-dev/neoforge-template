name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build + datagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --no-configuration-cache
      - name: Run data generation
        run: ./gradlew runData --no-configuration-cache
      - name: Check generated resources are committed
        run: |
          git status --porcelain src/generated
          test -z "$(git status --porcelain src/generated)" || echo "::warning::src/generated mudou. Rode 'Data' e commite o resultado."
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: generated-resources
          path: src/generated/resources

  rename-test:
    name: Rename script (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Rename template
        shell: pwsh
        run: ./rename.ps1 -ModId testmod -ModName "Test Mod" -Package dev.test.testmod -Author "CI"
      - name: Build renamed mod
        run: ./gradlew.bat build --no-configuration-cache
