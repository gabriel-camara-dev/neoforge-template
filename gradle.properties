# Memória padrão do Gradle. Pode ser sobrescrita pelo usuário ou pela linha de comando.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Versões do ambiente
# Últimas versões: https://projects.neoforged.net/neoforged/neoforge
# A versão do Minecraft precisa bater com a do NeoForge.
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.8-beta

## Propriedades do mod
# ID único do mod. Minúsculo, regex [a-z][a-z0-9_]{1,63}.
# Precisa ser igual à constante MOD_ID da classe principal (o script rename faz isso por você).
mod_id=examplemod
# Nome legível do mod.
mod_name=Example Mod
# Licença do mod. Veja https://choosealicense.com/
mod_license=All Rights Reserved
# Versão do mod. Veja https://semver.org/
mod_version=0.1.0-26.3
# Group ID (deve bater com o pacote base do código).
mod_group_id=com.example.examplemod
# Autor(es) e descrição exibidos na tela de Mods.
mod_authors=YourName
mod_description=Um mod criado a partir do template.
